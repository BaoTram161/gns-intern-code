services:
  web:
    build: .
    environment:
      ACTIVE_STORAGE_SERVICE: local
    volumes:
      - ./log:/rails/log
      - ./storage:/rails/storage
    ports:
      - "3000:80"
    secrets:
      - source: master_key
        target: /rails/config/master.key

secrets:
  master_key:
    file: ./config/master.key