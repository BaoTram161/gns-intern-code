services:
  web:
    build: .
    environment:
      ACTIVE_STORAGE_SERVICE: local
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      - ./log:/rails/log
      - ./storage:/rails/storage
    ports:
      - "3000:80"
    secrets:
      - source: master_key
        target: /rails/config/master.key

secrets:
  master_key:
    file: ./config/master.key